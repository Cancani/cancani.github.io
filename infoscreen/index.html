<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>TBZ Stage Infoscreen Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      padding: 24px 36px;
      background: #1f1f1f;
      border-bottom: 1px solid #333;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 8px;
      color: #bbb;
      font-size: 16px;
    }

    main {
      padding: 32px 36px;
    }

    .box {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      color: #ddd;
    }

    input {
      width: 100%;
      max-width: 500px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 16px;
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .status {
      margin-bottom: 24px;
      color: #bbb;
    }

    .event {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .meta {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 6px;
    }

    .tag {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-size: 14px;
    }

    .error {
      color: #ff6b6b;
      font-size: 18px;
      font-weight: bold;
    }

    .ok {
      color: #72d572;
      font-size: 18px;
      font-weight: bold;
    }

    pre {
      background: #000;
      color: #eee;
      padding: 16px;
      overflow: auto;
      max-height: 350px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

<header>
  <h1>TBZ Stage Infoscreen Test</h1>
  <div class="subtitle">Anzeige der Einträge mit Kategorie Display aus der Stage API</div>
</header>

<main>
  <div class="box">
    <label>API URL</label>
    <input id="apiUrl" value="https://apistage.tam.ch/tbz/event">

    <label>Username</label>
    <input id="username" value="rest-event">

    <label>Prefix</label>
    <input id="prefix" value="gr001">

    <label>API Passwort</label>
    <input id="password" type="password" placeholder="API Passwort eingeben">

    <button onclick="loadEvents()">Einträge laden</button>

    <p id="status" class="status"></p>
  </div>

  <div id="events"></div>

  <div class="box">
    <h2>Rohdaten</h2>
    <pre id="raw"></pre>
  </div>
</main>

<script>
async function loadEvents() {
  const apiUrl = document.getElementById("apiUrl").value.trim();
  const username = document.getElementById("username").value.trim();
  const prefix = document.getElementById("prefix").value.trim();
  const password = document.getElementById("password").value;

  const status = document.getElementById("status");
  const container = document.getElementById("events");
  const raw = document.getElementById("raw");

  status.textContent = "Lade Daten...";
  container.innerHTML = "";
  raw.textContent = "";

  if (!apiUrl || !username || !prefix || !password) {
    status.innerHTML = '<span class="error">Bitte alle Felder ausfüllen.</span>';
    return;
  }

  try {
    const authDate = new Date().toUTCString();

    const userPasswd = await sha1Base64(password);
    const signature = await hmacSha1PhpStyle(userPasswd, authDate);

    const usernameBase64 = btoa(username);
    const authorization = `${prefix} ${usernameBase64}:${signature}`;

    const response = await fetch(apiUrl, {
      method: "GET",
      headers: {
        "X-gr-AuthDate": authDate,
        "Authorization": authorization,
        "Accept": "application/json"
      }
    });

    const text = await response.text();
    raw.textContent = text;

    if (!response.ok) {
      status.innerHTML = `<span class="error">API Fehler. HTTP Status: ${response.status}</span>`;
      return;
    }

    const data = JSON.parse(text);
    const events = Array.isArray(data.body) ? data.body : [];

    const displayEvents = events
      .filter(event => String(event.Tag).toLowerCase() === "display")
      .sort((a, b) => new Date(a.Datum) - new Date(b.Datum));

    status.innerHTML = `<span class="ok">${displayEvents.length} Display Einträge gefunden.</span>`;

    if (displayEvents.length === 0) {
      container.innerHTML = '<div class="box">Keine Display Einträge gefunden.</div>';
      return;
    }

    container.innerHTML = displayEvents.map(event => `
      <div class="event">
        <div class="title">${escapeHtml(event.Termin_Titel || "")}</div>
        <div class="meta"><strong>Datum:</strong> ${escapeHtml(event.DatumText || "")}</div>
        <div class="meta"><strong>Ort:</strong> ${escapeHtml(event.Ort || "")}</div>
        <div class="meta"><strong>Schule:</strong> ${escapeHtml(event.Schule || "")}</div>
        <span class="tag">${escapeHtml(event.Tag || "")}</span>
      </div>
    `).join("");

  } catch (error) {
    status.innerHTML = '<span class="error">Fehler beim Abrufen der Daten. Wahrscheinlich CORS oder Authentifizierung.</span>';
    raw.textContent = error.message;
  }
}

async function sha1Base64(text) {
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const hashBuffer = await crypto.subtle.digest("SHA-1", data);
  return arrayBufferToBase64(hashBuffer);
}

async function hmacSha1PhpStyle(dataText, keyText) {
  const encoder = new TextEncoder();

  const key = await crypto.subtle.importKey(
    "raw",
    encoder.encode(keyText),
    { name: "HMAC", hash: "SHA-1" },
    false,
    ["sign"]
  );

  const signatureBuffer = await crypto.subtle.sign(
    "HMAC",
    key,
    encoder.encode(dataText)
  );

  const hexString = arrayBufferToHex(signatureBuffer);
  return btoa(hexString);
}

function arrayBufferToBase64(buffer) {
  let binary = "";
  const bytes = new Uint8Array(buffer);

  for (const byte of bytes) {
    binary += String.fromCharCode(byte);
  }

  return btoa(binary);
}

function arrayBufferToHex(buffer) {
  const bytes = new Uint8Array(buffer);

  return Array.from(bytes)
    .map(byte => byte.toString(16).padStart(2, "0"))
    .join("");
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
